# Linux VM deployment overlay. Apply together with docker-compose.yml.
services:
  postgres:
    # The full backup was produced by pg_dump 17 (custom format 1.16).
    image: postgres:17-alpine

  api:
    env_file:
      - .env.production
      - .env-databriks
    environment:
      ENV: production
      # SAML completes over the HTTPS reverse proxy on this VM.
      SSO_COOKIE_SECURE: "true"
      BOOTSTRAP_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
    scale: 6

  scheduler:
    env_file:
      - .env.production
      - .env-databriks
    environment:
      ENV: production
      SSO_COOKIE_SECURE: "true"
      BOOTSTRAP_ENABLED: "true"
      SCHEDULER_ENABLED: "true"

  worker:
    env_file:
      - .env.production
      - .env-databriks
    environment:
      ENV: production

  web:
    scale: 6

  trino:
    # VM capacity: 16 vCPU / 128 GiB RAM. Keep a CPU core available to the
    # API, PostgreSQL, ETL and the operating system.
    cpus: "1.0"
    mem_limit: 12g
    volumes:
      - ./infra/trino/catalog/iceberg.vm.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./infra/trino/config.vm.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.vm.config:/etc/trino/jvm.config:ro
    depends_on:
      postgres:
        condition: service_healthy

  trino-worker:
    # Four scalable workers plus trino-worker-2 below form a five-worker
    # cluster.  3.0 vCPU x 5 = 15 vCPU; with the coordinator this uses the
    # available VM CPU while leaving a small scheduling margin.
    cpus: "3.0"
    mem_limit: 12g
    scale: 4
    deploy:
      replicas: 4
    volumes:
      - ./infra/trino/catalog/iceberg.vm.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./infra/trino/config-worker.vm.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm-worker.vm.config:/etc/trino/jvm.config:ro

  trino-worker-2:
    cpus: "3.0"
    mem_limit: 12g
    volumes:
      - ./infra/trino/catalog/iceberg.vm.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./infra/trino/config-worker.vm.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm-worker.vm.config:/etc/trino/jvm.config:ro

  trino-worker-3:
    extends:
      service: trino-worker-2

  trino-worker-4:
    extends:
      service: trino-worker-2

  trino-worker-5:
    extends:
      service: trino-worker-2
