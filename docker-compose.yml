services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
      TRINO_URL: http://trino:8080
      ICEBERG_LOCAL_WAREHOUSE: /data/iceberg
      OPENFINOPS_WORKER_RUNTIME_DIR: /run/openfinops-worker
      BOOTSTRAP_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
    volumes:
      - ./apps/data/iceberg:/data/iceberg
      - ./backups/scheduled:/backups/scheduled
      - worker_runtime:/run/openfinops-worker
    depends_on:
      scheduler:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
      TRINO_URL: http://trino:8080
      ICEBERG_LOCAL_WAREHOUSE: /data/iceberg
      OPENFINOPS_WORKER_RUNTIME_DIR: /run/openfinops-worker
      BOOTSTRAP_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
    volumes:
      - ./apps/data/iceberg:/data/iceberg
      - ./backups/scheduled:/backups/scheduled
      - worker_runtime:/run/openfinops-worker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-u", "worker.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
      TRINO_URL: http://trino:8080
      ICEBERG_LOCAL_WAREHOUSE: /data/iceberg
      OPENFINOPS_WORKER_RUNTIME_DIR: /run/openfinops-worker
      OPENFINOPS_WORKER_CONCURRENCY: ${OPENFINOPS_WORKER_CONCURRENCY:-2}
      AZURE_EXTRACTION_WORKERS: ${AZURE_EXTRACTION_WORKERS:-2}
      OCI_EXTRACTION_WORKERS: ${OCI_EXTRACTION_WORKERS:-2}
      REPROCESS_CPU_WORKERS: ${REPROCESS_CPU_WORKERS:-2}
      REPROCESS_CLASSIFICATION_CHUNK_ROWS: ${REPROCESS_CLASSIFICATION_CHUNK_ROWS:-50000}
      REPROCESS_BATCH_ROWS: ${REPROCESS_BATCH_ROWS:-100000}
      REPROCESS_MEMORY_LIMIT_MB: ${REPROCESS_MEMORY_LIMIT_MB:-6144}
      REPROCESS_WORKER_MAX_TASKS: ${REPROCESS_WORKER_MAX_TASKS:-6}
    volumes:
      - ./apps/data/iceberg:/data/iceberg
      - ./backups/scheduled:/backups/scheduled
      - worker_runtime:/run/openfinops-worker
    depends_on:
      scheduler:
        condition: service_healthy
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5173:80"
      - "8000:8000"
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  trino:
    image: trinodb/trino:483
    # Trino is required by dashboards, pivots and forecasts.  It must start
    # with the default stack and recover automatically after a Docker restart.
    # Heap is 2G; cap RSS so the ~8 GiB Docker Desktop VM is not OOM-killed
    # (exit 137 → PAGE_TRANSPORT_ERROR on workers).
    restart: unless-stopped
    # Coordinator only schedules; retain sufficient native JVM headroom.
    mem_limit: 2560m
    # Linux hosts do not resolve host.docker.internal unless this mapping is set.
    # Trino's Iceberg JDBC catalog reaches the canonical PostgreSQL on the host (:5433).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
      - ./infra/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
      # Host paths in iceberg_tables (PyIceberg) + file:///data/iceberg (Trino Hadoop FS).
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/data/iceberg
      - ./apps/data/iceberg:/tmp/data/iceberg

  trino-worker:
    image: trinodb/trino:483
    restart: unless-stopped
    # Keep the whole local cluster below Docker Desktop's 7.65 GiB VM. Query
    # concurrency is bounded in config-worker.properties; a bigger limit here
    # only lets two workers evict the coordinator and one another.
    mem_limit: 2500m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/config-worker.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm-worker.config:/etc/trino/jvm.config:ro
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/data/iceberg
      - ./apps/data/iceberg:/tmp/data/iceberg
    depends_on:
      trino:
        condition: service_healthy
    # `deploy.replicas` is ignored by `docker compose up` (Swarm only).
    # Scale with: docker compose up -d --scale trino-worker=${TRINO_WORKERS:-1}
    deploy:
      replicas: ${TRINO_WORKERS:-1}

  # A second fixed worker keeps local Compose independent of Swarm's
  # deploy.replicas semantics. Both workers mount the same Iceberg warehouse
  # and join the coordinator through discovery.
  trino-worker-2:
    image: trinodb/trino:483
    restart: unless-stopped
    mem_limit: 2500m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/config-worker.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm-worker.config:/etc/trino/jvm.config:ro
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/data/iceberg
      - ./apps/data/iceberg:/tmp/data/iceberg
    depends_on:
      trino:
        condition: service_healthy

volumes:
  pgdata:
  worker_runtime:
