services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
      TRINO_URL: http://trino:8080
      ICEBERG_LOCAL_WAREHOUSE: /data/iceberg
      OPENFINOPS_WORKER_RUNTIME_DIR: /run/openfinops-worker
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/data/iceberg:/data/iceberg
      - worker_runtime:/run/openfinops-worker
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-u", "worker.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
      TRINO_URL: http://trino:8080
      ICEBERG_LOCAL_WAREHOUSE: /data/iceberg
      OPENFINOPS_WORKER_RUNTIME_DIR: /run/openfinops-worker
      OPENFINOPS_WORKER_CONCURRENCY: ${OPENFINOPS_WORKER_CONCURRENCY:-3}
      REPROCESS_CPU_WORKERS: ${REPROCESS_CPU_WORKERS:-2}
      REPROCESS_CLASSIFICATION_CHUNK_ROWS: ${REPROCESS_CLASSIFICATION_CHUNK_ROWS:-50000}
      REPROCESS_BATCH_ROWS: ${REPROCESS_BATCH_ROWS:-100000}
      REPROCESS_MEMORY_LIMIT_MB: ${REPROCESS_MEMORY_LIMIT_MB:-6144}
      REPROCESS_WORKER_MAX_TASKS: ${REPROCESS_WORKER_MAX_TASKS:-6}
    volumes:
      - ./apps/data/iceberg:/data/iceberg
      - worker_runtime:/run/openfinops-worker
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

  trino:
    image: trinodb/trino:483
    # Trino is required by dashboards, pivots and forecasts.  It must start
    # with the default stack and recover automatically after a Docker restart.
    # Heap is 2G; cap RSS so the ~8 GiB Docker Desktop VM is not OOM-killed
    # (exit 137 → PAGE_TRANSPORT_ERROR on workers).
    restart: unless-stopped
    mem_limit: 2560m
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
      - ./infra/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
      # Host paths in iceberg_tables (PyIceberg) + file:///data/iceberg (Trino Hadoop FS).
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/data/iceberg
      - ./apps/data/iceberg:/tmp/data/iceberg

  trino-worker:
    image: trinodb/trino:483
    restart: unless-stopped
    mem_limit: 2560m
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/config-worker.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm-worker.config:/etc/trino/jvm.config:ro
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/data/iceberg
      - ./apps/data/iceberg:/tmp/data/iceberg
    depends_on:
      trino:
        condition: service_healthy
    # `deploy.replicas` is ignored by `docker compose up` (Swarm only).
    # Scale with: docker compose up -d --scale trino-worker=${TRINO_WORKERS:-1}
    deploy:
      replicas: ${TRINO_WORKERS:-1}

volumes:
  pgdata:
  worker_runtime:
