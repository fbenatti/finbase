services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://finops:finops@postgres:5432/finops
      DATABASE_URL_SYNC: postgresql://finops:finops@postgres:5432/finops
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:8001
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  nessie:
    image: projectnessie/nessie:latest
    restart: unless-stopped
    ports:
      - "19120:19120"
    environment:
      nessie.version.store.type: IN_MEMORY
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:latest
    # Trino is required by dashboards, pivots and forecasts.  It must start
    # with the default stack and recover automatically after a Docker restart.
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
      - ./infra/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
      # Keep the absolute file:// locations emitted by the local PyIceberg
      # SQL catalog readable from inside Trino.
      - ./apps/data/iceberg:/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
      - ./apps/data/iceberg:/tmp/Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
