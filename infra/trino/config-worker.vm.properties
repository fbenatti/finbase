# Worker profile for the 16-vCPU / 128-GiB Linux VM.
coordinator=false
node.environment=finops
http-server.http.port=8080
discovery.uri=http://trino:8080

# Each worker receives 9 GiB Java heap inside a 12 GiB container.  Keeping
# four execution threads per worker yields 20 Trino CPU threads across five
# workers, leaving CPU capacity for the coordinator, PostgreSQL and ETL.
# Trino reserves 30% of heap by default.  On a dedicated 12-GiB heap worker,
# a 1-GiB reserve keeps the memory budget within the 9-GiB worker heap while
# exposing 8 GiB for
# a single query on that worker.
memory.heap-headroom-per-node=1GB
query.max-memory-per-node=8GB
task.concurrency=4
task.max-worker-threads=4
task.min-drivers=8
task.max-drivers-per-task=16
task.max-partial-aggregation-memory=512MB
query.max-run-time=45m
query.client.timeout=15m
