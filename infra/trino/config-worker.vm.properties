# Worker profile for the 16-vCPU / 128-GiB Linux VM.
coordinator=false
node.environment=finops
http-server.http.port=8080
discovery.uri=http://trino:8080

# Each worker receives 12 GiB Java heap inside a 16 GiB container.  Keeping
# three execution threads per worker yields 15 Trino CPU threads across five
# workers, leaving CPU capacity for the coordinator, PostgreSQL and ETL.
# Trino reserves 30% of heap by default.  On a dedicated 12-GiB heap worker,
# a 2-GiB reserve keeps JNI/direct-memory headroom while exposing 10 GiB for
# a single query on that worker.
memory.heap-headroom-per-node=2GB
query.max-memory-per-node=10GB
task.concurrency=4
task.max-worker-threads=3
task.min-drivers=8
task.max-drivers-per-task=12
task.max-partial-aggregation-memory=256MB
query.max-run-time=30m
query.client.timeout=10m
