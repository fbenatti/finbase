coordinator=false
node.environment=finops
http-server.http.port=8080
discovery.uri=http://trino:8080

# Docker Desktop caps this worker at 2.5 GB; its query limit must fit below
# the JVM heap to avoid restart loops during dashboard queries.
query.max-memory-per-node=1GB
query.max-run-time=15m
query.client.timeout=5m
