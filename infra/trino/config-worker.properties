coordinator=false
node.environment=finops
http-server.http.port=8080
discovery.uri=http://trino:8080

# Keep worker memory bounded on the 30 GiB server. Three workers at this
# profile leave headroom for the coordinator, PostgreSQL and the remaining
# services.
query.max-memory-per-node=2GB
query.max-run-time=15m
query.client.timeout=5m
