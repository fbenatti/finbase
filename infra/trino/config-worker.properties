coordinator=false
node.environment=finops
http-server.http.port=8080
discovery.uri=http://trino:8080

# This local Docker Desktop VM has 7.65 GiB shared by coordinator, two workers
# and the application containers.  Forecast performs wide aggregations: the
# stock thread settings schedule up to 20 split workers per Trino node here,
# saturating the VM and making workers return HTTP 503 mid-exchange.  Bound
# drivers per worker so a query fails by its explicit memory limit instead of
# taking a worker out of the cluster (PAGE_TRANSPORT_ERROR).
query.max-memory-per-node=1400MB
# One forecast is executed at a time, but it is a wide 16-dimension
# aggregation.  With the other local development stacks sharing Docker
# Desktop's 7.65 GiB VM, four split threads per worker are the safe ceiling.
task.concurrency=2
task.max-worker-threads=4
task.min-drivers=4
task.max-drivers-per-task=4
task.max-partial-aggregation-memory=8MB
query.max-run-time=15m
query.client.timeout=5m
