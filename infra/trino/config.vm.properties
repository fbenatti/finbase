# Coordinator profile for the 16-vCPU / 128-GiB Linux VM.
coordinator=true
node.environment=finops
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://trino:8080

web-ui.authentication.type=fixed
web-ui.user=finops

# Five 10-GiB workers provide 50 GiB of query user memory.  The global cap
# deliberately stays below that total so PostgreSQL, the API and Linux page
# cache retain substantial headroom for the local Iceberg warehouse.
query.max-memory=48GB
query.max-total-memory=56GB
query.max-run-time=30m
query.client.timeout=10m
