coordinator=true
node.environment=finops
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Trino 477+ Web UI defaults to FORM login. Without a session cookie,
# /ui/api/query returns 401 ("Query list could not be loaded") even though
# the SQL API at /v1/statement still works with X-Trino-User. Fixed user
# keeps the local stack usable without a password prompt.
web-ui.authentication.type=fixed
web-ui.user=finops

# Single-node local stack: cap per-query memory so one forecast/pivot cannot
# take the entire JVM and trigger ExitOnOutOfMemoryError. The classified
# FOCUS pass (Relacionamentos IA) scans multi-million-row Gold partitions
# with UNNEST; heap is 6G (host 16G) leaving headroom for ~4G of query memory.
query.max-memory=3GB
query.max-memory-per-node=3GB
query.max-total-memory=4GB
query.max-run-time=15m
query.client.timeout=5m
