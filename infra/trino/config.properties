coordinator=true
node.environment=finops
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Single-node local stack: cap per-query memory so one forecast/pivot cannot
# take the entire JVM and trigger ExitOnOutOfMemoryError (2 GB heap was too tight
# for 25M-row Gold aggregations).
query.max-memory=2GB
query.max-memory-per-node=2GB
query.max-total-memory=3GB
query.max-run-time=15m
query.client.timeout=5m
