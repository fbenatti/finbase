# The API writes Iceberg metadata to the PyIceberg SQL catalog in PostgreSQL
# and Parquet files to the local warehouse. Trino uses the same catalog and
# filesystem.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=sql
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
# The local API/worker use the host PostgreSQL instance on port 5433. Point
# Trino at that same catalog; the compose PostgreSQL container is a separate
# database and otherwise serves stale Iceberg metadata to /analysis.
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://host.docker.internal:5433/finops
iceberg.jdbc-catalog.connection-user=finops
iceberg.jdbc-catalog.connection-password=finops
# Use the host-visible absolute path also mounted in Trino.  PyIceberg (API)
# and Trino must persist identical metadata locations so DIMON staged-table
# swaps can be completed by either process.
iceberg.jdbc-catalog.default-warehouse-dir=file:///Users/fernandohenriquebenatti/projetos/OpenFinops/apps/data/iceberg
fs.local.enabled=true
# PyIceberg persists local SQL-catalog locations with the file:// scheme.
# Trino's native local filesystem expects local://, so keep the Hadoop
# filesystem enabled to read existing file:// metadata and Parquet paths.
fs.hadoop.enabled=true
