# The API writes Iceberg metadata to the PyIceberg SQL catalog in PostgreSQL
# and Parquet files to the local warehouse. Trino uses the same catalog and
# filesystem.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=sql
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
# The local API/worker use the host PostgreSQL instance on port 5433. Point
# Trino at that same catalog; the compose PostgreSQL container is a separate
# database and otherwise serves stale Iceberg metadata to /analysis.
# On Linux, docker-compose.yml must set extra_hosts host.docker.internal:host-gateway
# so this hostname resolves from inside the Trino containers.
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://host.docker.internal:5433/finops
iceberg.jdbc-catalog.connection-user=finops
iceberg.jdbc-catalog.connection-password=finops
# Catalog and manifests use the portable file:///data/iceberg prefix. Trino
# resolves it via the /data/iceberg bind mount in docker-compose.yml.
iceberg.jdbc-catalog.default-warehouse-dir=file:///data/iceberg
# PyIceberg persists locations with the file:// scheme and percent-encodes the
# `=` in Hive-style partition directories. The native local filesystem resolves
# file:// under /tmp and does not decode %3D, so it must stay disabled: Hadoop FS
# is the only one that maps file:///data/iceberg to /data/iceberg and decodes the
# partition names back to `_billing_period=YYYYMM`.
fs.hadoop.enabled=true
