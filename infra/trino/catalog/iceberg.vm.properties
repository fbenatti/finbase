# VM deployment override: PostgreSQL is the Compose service restored from the
# full backup, not the development host PostgreSQL instance.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=sql
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/finops
iceberg.jdbc-catalog.connection-user=finops
iceberg.jdbc-catalog.connection-password=finops
iceberg.jdbc-catalog.default-warehouse-dir=file:///data/iceberg
fs.hadoop.enabled=true
