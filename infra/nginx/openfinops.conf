# Private HTTPS endpoint for the restored OpenFinops VM.  The two host names
# are intentionally kept separate so the API can later receive its own public
# DNS record and trusted certificate without changing the application.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Oracle Linux 8 ships Nginx 1.14 with a small default hash bucket.
server_names_hash_bucket_size 128;

# Access tokens include the effective RBAC permissions and can exceed Nginx's
# default 8 KiB header line limit when sent as Authorization: Bearer <JWT>.
client_header_buffer_size 16k;
large_client_header_buffers 4 32k;

server {
    listen 80;
    listen [::]:80;
    server_name finopsintelligence.telefonicati.onmicrosoft.com api.finopsintelligence.telefonicati.onmicrosoft.com finopsintelligence.telefonicabigdata.com api.finopsintelligence.telefonicabigdata.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finopsintelligence.telefonicati.onmicrosoft.com finopsintelligence.telefonicabigdata.com;

    ssl_certificate     /etc/pki/openfinops/tls.crt;
    ssl_certificate_key /etc/pki/openfinops/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1g;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The React client uses /api.  Preserve the current Vite proxy behavior:
    # forward to FastAPI while removing that prefix.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        # Temporarily points to the host FastAPI dev server. Revert to 8000
        # when the containerized API is restored; see docs/VITE_DEV_SETUP.md.
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.finopsintelligence.telefonicati.onmicrosoft.com api.finopsintelligence.telefonicabigdata.com;

    ssl_certificate     /etc/pki/openfinops/tls.crt;
    ssl_certificate_key /etc/pki/openfinops/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1g;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
